<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阅读demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e8dff5 0%, #fce4ec 50%, #e0f7fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 50px;
            padding: 12px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 2px #333;
            position: relative;
            overflow: hidden;
        }

        .phone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: #000;
            border-radius: 0 0 18px 18px;
            z-index: 100;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #f6f1e7;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px 6px;
            font-size: 14px;
            font-weight: 600;
            color: #5a4d3a;
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 5px;
            font-size: 12px;
            align-items: center;
        }

        /* 顶部阅读导航 */
        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px 10px;
            flex-shrink: 0;
            color: #5a4d3a;
        }

        .reader-nav .rn-btn {
            font-size: 18px;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .reader-nav .rn-btn:active {
            background: rgba(0, 0, 0, 0.06);
        }

        .reader-nav .rn-title {
            font-size: 15px;
            font-weight: 700;
            color: #4a3f2f;
            max-width: 60%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 阅读内容区 */
        .reader-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 6px 26px 24px;
        }

        .reader-content::-webkit-scrollbar {
            display: none;
        }

        .chapter-label {
            text-align: center;
            font-size: 12px;
            color: #a89a82;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .chapter-title {
            text-align: center;
            font-size: 21px;
            font-weight: 700;
            color: #3a3125;
            margin-bottom: 4px;
        }

        .chapter-author {
            text-align: center;
            font-size: 12px;
            color: #b0a38c;
            margin-bottom: 26px;
        }

        .reader-content p {
            font-size: 16.5px;
            line-height: 2;
            color: #43382a;
            text-indent: 2em;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }

        .chapter-end {
            text-align: center;
            color: #b0a38c;
            font-size: 13px;
            margin: 26px 0 8px;
            letter-spacing: 4px;
        }

        /* 底部工具栏 */
        .reader-toolbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
            background: rgba(255, 252, 245, 0.96);
            border-top: 1px solid rgba(90, 77, 58, 0.12);
        }

        .tool-btn {
            background: none;
            border: none;
            color: #6b5d47;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .tool-btn i {
            font-size: 18px;
        }

        .tool-btn:active {
            opacity: 0.6;
        }

        .tool-btn.tip i {
            color: #f5a623;
        }

        /* 章节切换大按钮 */
        .chapter-switch {
            display: flex;
            gap: 10px;
            padding: 4px 26px 14px;
            flex-shrink: 0;
        }

        .chapter-switch button {
            flex: 1;
            padding: 11px 0;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid rgba(77, 155, 148, 0.4);
            background: rgba(77, 155, 148, 0.08);
            color: #4D9B94;
            transition: transform 0.15s;
        }

        .chapter-switch button.primary {
            background: #4D9B94;
            color: #fff;
            border-color: #4D9B94;
        }

        .chapter-switch button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="phone-frame">
        <div class="phone-notch"></div>

        <div class="screen">
            <div class="status-bar">
                <span class="time">8:29</span>
                <div class="status-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>

            <!-- 顶部导航 -->
            <div class="reader-nav">
                <div class="rn-btn" id="navBack"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="rn-title" id="bookTitle">《作品名称》</div>
                <div class="rn-btn" id="navMenu"><i class="fa-solid fa-ellipsis"></i></div>
            </div>

            <!-- 正文 -->
            <div class="reader-content" id="readerContent">
                <div class="chapter-label">第 13 章</div>
                <div class="chapter-title">章节名称</div>
                <div class="chapter-author" id="chapterAuthor">作者 · 作者名称</div>

                <p>文字区域</p>

                <div class="chapter-end">· 本章完 ·</div>
            </div>

            <!-- 章节切换 -->
            <div class="chapter-switch">
                <button id="prevChapter"><i class="fa-solid fa-chevron-left"></i> 上一章</button>
                <button class="primary" id="nextChapter">下一章 <i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- 底部工具栏 -->
            <div class="reader-toolbar">
                <button class="tool-btn" id="toolCatalog"><i class="fa-solid fa-list-ul"></i>目录</button>
                <button class="tool-btn" id="toolFont"><i class="fa-solid fa-text-height"></i>字号</button>
                <button class="tool-btn" id="toolComment"><i class="fa-regular fa-comment"></i>评论</button>
                <button class="tool-btn tip" id="toolTip"><i class="fa-solid fa-coins"></i>打赏</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 从 URL 参数读取作品与作者（默认占位：《作品名称》· 作者名称）
            var params = new URLSearchParams(window.location.search);
            var book = params.get('title') || '《作品名称》';
            var author = params.get('author') || '作者名称';
            var bookTitleEl = document.getElementById('bookTitle');
            var chapterAuthorEl = document.getElementById('chapterAuthor');
            if (bookTitleEl) bookTitleEl.textContent = book;
            if (chapterAuthorEl) chapterAuthorEl.textContent = '作者 · ' + author;

            // 返回上一页
            var navBack = document.getElementById('navBack');
            if (navBack) {
                navBack.addEventListener('click', function () {
                    if (history.length > 1) {
                        history.back();
                    } else {
                        window.location.href = 'serial.html';
                    }
                });
            }

            // 工具栏与章节按钮（演示提示）
            function tip(msg) {
                alert(msg);
            }
            document.getElementById('navMenu').addEventListener('click', function () { tip('阅读设置（演示）'); });
            document.getElementById('prevChapter').addEventListener('click', function () { tip('已是第一章（演示）'); });
            document.getElementById('nextChapter').addEventListener('click', function () { tip('下一章更新中，敬请期待（演示）'); });
            document.getElementById('toolCatalog').addEventListener('click', function () { tip('打开' + book + '目录（演示）'); });
            document.getElementById('toolFont').addEventListener('click', function () { tip('调整字号（演示）'); });
            document.getElementById('toolComment').addEventListener('click', function () { tip('查看' + book + '评论（演示）'); });
            document.getElementById('toolTip').addEventListener('click', function () {
                tip('打赏鼓励 ' + book + ' · ' + author + '（演示）');
            });
        });
    </script>
</body>

</html>
